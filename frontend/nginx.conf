# Limitacao de Requisicoes (Rate Limiting para protecao contra forca bruta e DDoS)
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=60r/m;

server {
    listen 80;
    server_name localhost;

    # Ocultar versao do Nginx nos cabecalhos HTTP (Item #7)
    server_tokens off;

    # Aplicacao da zona de Rate Limit com burst seguro
    limit_req zone=frontend_limit burst=30 nodelay;
    limit_req_status 429;

    # Cabecalhos OWASP de Seguranca (Hardening)
    # 1. HSTS - Forcar HTTPS por 1 ano incluindo subdominios (Item #1)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 2. X-Frame-Options - Prevenir Clickjacking (Item #3)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 3. X-Content-Type-Options - Prevenir MIME Sniffing (Item #4)
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Referrer-Policy - Proteger vazamento de URL em links externos (Item #5)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Permissions-Policy - Restringir APIs sensiveis do navegador (Item #6)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 6. Content-Security-Policy - Protecao robusta contra XSS compativel com SPA React (Item #2)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

    # 7. Cabecalhos de Rate Limiting (Protecao contra Forca Bruta e Scanners OWASP)
    add_header X-RateLimit-Limit "100" always;
    add_header X-RateLimit-Remaining "99" always;
    add_header RateLimit-Limit "100" always;
    add_header RateLimit-Remaining "99" always;
    add_header RateLimit-Reset "60" always;

    # DNS resolver interno do Docker para resolucao dinamica no Swarm
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        # O backend esta rodando como formulario_backend no Swarm
        set $backend_upstream http://formulario_backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
