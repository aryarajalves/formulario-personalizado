<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" flood-color="#000000"/>
    </filter>
  </defs>
  
  <!-- Prancheta / Fundo do Formulário -->
  <rect x="8" y="6" width="32" height="38" rx="5" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Cabeçalho do Formulário com Clipe -->
  <path d="M16 4h16a2 2 0 0 1 2 2v2H14V6a2 2 0 0 1 2-2z" fill="url(#primaryGrad)"/>
  <rect x="20" y="3" width="8" height="3" rx="1.5" fill="#93c5fd"/>
  
  <!-- Linhas e Campos do Formulário -->
  <!-- Pergunta 1: Checkbox marcado -->
  <rect x="13" y="14" width="6" height="6" rx="1.5" fill="url(#checkGrad)"/>
  <path d="M14.5 17l1.2 1.2 2.3-2.4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="22" y="15.5" width="14" height="3" rx="1.5" fill="#cbd5e1"/>
  
  <!-- Pergunta 2: Radio button selecionado -->
  <circle cx="16" cy="25" r="3" fill="#e2e8f0" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="16" cy="25" r="1.5" fill="#3b82f6"/>
  <rect x="22" y="23.5" width="12" height="3" rx="1.5" fill="#cbd5e1"/>
  
  <!-- Pergunta 3: Campo de texto -->
  <rect x="13" y="31" width="22" height="7" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="15" y="33.5" width="8" height="2" rx="1" fill="#3b82f6"/>
</svg>