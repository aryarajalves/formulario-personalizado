<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo Tecnológico e Imersivo -->
  <rect width="800" height="500" fill="url(#bgGradient)"/>

  <!-- Orbs de Iluminação de Fundo -->
  <circle cx="200" cy="150" r="160" fill="#6366f1" opacity="0.25" filter="url(#glowEffect)"/>
  <circle cx="620" cy="360" r="180" fill="#0284c7" opacity="0.3" filter="url(#glowEffect)"/>
  <circle cx="480" cy="120" r="120" fill="#ec4899" opacity="0.15" filter="url(#glowEffect)"/>

  <!-- Grid decorativa sutil -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- CARTÃO PRINCIPAL: Formulário Interativo em Perspectiva Glassmorphism -->
  <g filter="url(#softShadow)">
    <!-- Moldura Glassmorphism -->
    <rect x="180" y="60" width="440" height="380" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>

    <!-- Barra Superior da Janela de Formulário -->
    <rect x="180" y="60" width="440" height="42" rx="20" fill="rgba(255, 255, 255, 0.08)"/>
    <circle cx="210" cy="81" r="5" fill="#f43f5e" opacity="0.8"/>
    <circle cx="226" cy="81" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="242" cy="81" r="5" fill="#10b981" opacity="0.8"/>
    <rect x="290" y="74" width="220" height="14" rx="7" fill="rgba(255, 255, 255, 0.1)"/>

    <!-- Barra de Progresso do Formulário -->
    <rect x="220" y="125" width="360" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)"/>
    <rect x="220" y="125" width="240" height="6" rx="3" fill="url(#neonCyan)"/>
    <circle cx="460" cy="128" r="7" fill="#38bdf8" filter="url(#glowEffect)"/>

    <!-- Pergunta 1: Título e Campo -->
    <text x="220" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#38bdf8">1 → Qual é o seu objetivo principal?</text>
    <rect x="220" y="180" width="360" height="40" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <text x="240" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" fill="#cbd5e1">Criar formulários de alta conversão</text>

    <!-- Pergunta 2: Múltipla Escolha Interativa -->
    <text x="220" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#e2e8f0">2 → Selecione o seu canal preferido:</text>
    
    <!-- Opção A (Selecionada) -->
    <rect x="220" y="265" width="172" height="42" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="232" y="275" width="22" height="22" rx="6" fill="#10b981"/>
    <path d="M238 286l3 3 6-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="264" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" fill="#ffffff">WhatsApp Web</text>

    <!-- Opção B -->
    <rect x="408" y="265" width="172" height="42" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
    <rect x="420" y="275" width="22" height="22" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
    <text x="427" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" fill="#94a3b8">B</text>
    <text x="452" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#94a3b8">Google Agenda</text>

    <!-- Botão de Ação / Avançar -->
    <g filter="url(#glowEffect)">
      <rect x="220" y="340" width="140" height="44" rx="10" fill="url(#neonCyan)"/>
    </g>
    <text x="260" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" fill="#0f172a">Avançar →</text>

    <text x="375" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">pressione <tspan font-weight="700" fill="#ffffff">Enter ↵</tspan></text>
  </g>

  <!-- Card Flutuante Esquerdo: Analytics de Taxa de Conclusão -->
  <g filter="url(#softShadow)" transform="translate(60, 220)">
    <rect width="180" height="110" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>
    <circle cx="35" cy="40" r="16" fill="rgba(16, 185, 129, 0.2)"/>
    <path d="M29 40l4 4 8-8" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">Taxa de Conclusão</text>
    <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="800" fill="#34d399">94.8%</text>
    <rect x="20" y="78" width="140" height="12" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="20" y="78" width="128" height="12" rx="6" fill="url(#neonGreen)"/>
  </g>

  <!-- Card Flutuante Direito: Leads em Tempo Real -->
  <g filter="url(#softShadow)" transform="translate(560, 110)">
    <rect width="180" height="100" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>
    <circle cx="35" cy="38" r="16" fill="rgba(56, 189, 248, 0.2)"/>
    <circle cx="35" cy="38" r="6" fill="#38bdf8"/>
    <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#94a3b8">Respostas Capturadas</text>
    <text x="60" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="800" fill="#ffffff">+1.480</text>
    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#38bdf8">⚡ Captura parcial ativa</text>
  </g>
</svg>
